name: Monorepo CI
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "k8s/lab4/**"
      - "sonar-project.properties"
      - ".github/workflows/ci-all.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "k8s/lab4/**"
      - "sonar-project.properties"
      - ".github/workflows/ci-all.yml"
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test + Coverage >= 80%
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/index.html

  backend-build:
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build (no tests)
        run: ./gradlew clean assemble

  frontend-test:
    runs-on: ubuntu-latest
    needs: backend-build
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Keep only index.html
        run: |
          rm -rf build/_app

  sonarqube:
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate SonarQube secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          test -n "${SONAR_TOKEN:-}" || (echo "Missing secret: SONAR_TOKEN" && exit 1)
          test -n "${SONAR_HOST_URL:-}" || (echo "Missing secret: SONAR_HOST_URL" && exit 1)
          echo "SONAR_HOST_URL=${SONAR_HOST_URL}" >> "$GITHUB_ENV"

      - name: Backend tests + JaCoCo coverage
        working-directory: backend
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run check

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Self-hosted SonarQube scan and quality gate
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  push-images:
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - sonarqube
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YC secrets
        env:
          YC_OAUTH_TOKEN: ${{ secrets.YC_OAUTH_TOKEN }}
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          test -n "${YC_OAUTH_TOKEN:-}" || (echo "Missing secret: YC_OAUTH_TOKEN" && exit 1)
          test -n "${YC_REGISTRY_ID:-}" || (echo "Missing secret: YC_REGISTRY_ID" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: oauth
          password: ${{ secrets.YC_OAUTH_TOKEN }}

      - name: Prepare image metadata
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/atm-backend:${{ env.SHORT_SHA }}
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/atm-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/atm-frontend:${{ env.SHORT_SHA }}
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/atm-frontend:latest

  update-gitops-images:
    runs-on: ubuntu-latest
    needs: push-images
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Argo CD image tags
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          test -n "${YC_REGISTRY_ID:-}" || (echo "Missing secret: YC_REGISTRY_ID" && exit 1)

          sed -i "s|newName: cr.yandex/.*/atm-backend|newName: cr.yandex/${YC_REGISTRY_ID}/atm-backend|g" k8s/lab4/yc/kustomization.yaml
          sed -i "s|newName: cr.yandex/.*/atm-frontend|newName: cr.yandex/${YC_REGISTRY_ID}/atm-frontend|g" k8s/lab4/yc/kustomization.yaml
          sed -i "s/newTag: .*/newTag: ${SHORT_SHA}/g" k8s/lab4/yc/kustomization.yaml

      - name: Commit GitOps manifest
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/lab4/yc/kustomization.yaml

          if git diff --cached --quiet; then
            echo "GitOps image tags are already up to date."
            exit 0
          fi

          git commit -m "chore: update lab4 image tags to ${SHORT_SHA} [skip ci]"
          git push

  notify-telegram:
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - backend-build
      - frontend-test
      - frontend-build
      - sonarqube
      - push-images
      - update-gitops-images
    if: always()

    steps:
      - name: Send pipeline status to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OVERALL_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          BACKEND_TEST: ${{ needs.backend-test.result }}
          BACKEND_BUILD: ${{ needs.backend-build.result }}
          FRONTEND_TEST: ${{ needs.frontend-test.result }}
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          SONARQUBE: ${{ needs.sonarqube.result }}
          PUSH_IMAGES: ${{ needs.push-images.result }}
          UPDATE_GITOPS_IMAGES: ${{ needs.update-gitops-images.result }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are not configured, notification skipped."
            exit 0
          fi

          MESSAGE=$(cat <<EOF
          ATM CI/CD pipeline: ${OVERALL_STATUS}

          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}

          Jobs:
          backend-test: ${BACKEND_TEST}
          backend-build: ${BACKEND_BUILD}
          frontend-test: ${FRONTEND_TEST}
          frontend-build: ${FRONTEND_BUILD}
          sonarqube: ${SONARQUBE}
          push-images: ${PUSH_IMAGES}
          update-gitops-images: ${UPDATE_GITOPS_IMAGES}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )

          curl --fail --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
