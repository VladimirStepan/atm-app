apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atm-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VladimirStepan/atm-app.git
    targetRevision: main
    path: k8s/lab4/yc
  destination:
    server: https://kubernetes.default.svc
    namespace: atm-lab3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
